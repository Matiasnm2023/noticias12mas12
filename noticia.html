const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const parametros=new URLSearchParams(window.location.search);const id=parametros.get("id");
function cambiarMeta(nombre,contenido,property=false){let meta=document.querySelector(property?`meta[property="${nombre}"]`:`meta[name="${nombre}"]`);if(!meta){meta=document.createElement("meta");meta.setAttribute(property?"property":"name",nombre);document.head.appendChild(meta)}meta.setAttribute("content",contenido)}
async function cargarNoticia(){const contenedor=document.getElementById("contenidoNoticia");if(!id){contenedor.innerHTML='<div class="error"><h2>Noticia no encontrada</h2><p>No se indicó qué noticia querés ver.</p><a class="volver" href="./index.html">← Volver a las noticias</a></div>';return}const {data,error}=await supabaseClient.from("noticias").select("*").eq("id",id).single();if(error||!data){console.error(error);contenedor.innerHTML='<div class="error"><h2>Noticia no encontrada</h2><p>La noticia que buscás no existe o fue eliminada.</p><a class="volver" href="./index.html">← Volver a las noticias</a></div>';return}
const titulo=data.titulo||"12 + 12 Noticias de Tigre";const descripcion=data.contenido?String(data.contenido).replace(/<[^>]*>/g,"").replace(/\s+/g," ").substring(0,200):"Noticias de Tigre y toda la información local.";let imagen=data.imagen||"https://noticias12mas12.com.ar/logo.jpg";try{imagen=new URL(imagen,window.location.href).href}catch(e){}
const urlActual=window.location.href;document.title=titulo+" | 12 + 12 Noticias de Tigre";cambiarMeta("og:title",titulo,true);cambiarMeta("og:description",descripcion,true);cambiarMeta("og:image",imagen,true);cambiarMeta("og:url",urlActual,true);cambiarMeta("og:type","article",true);cambiarMeta("og:site_name","12 + 12 Noticias de Tigre",true);cambiarMeta("twitter:title",titulo);cambiarMeta("twitter:description",descripcion);cambiarMeta("twitter:image",imagen);
let fechaTexto="";if(data.fecha){fechaTexto=new Date(data.fecha).toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"})}let contenidoHTML="";if(data.contenido){contenidoHTML=String(data.contenido).split(/\n\s*\n/).map(parrafo=>`<p>${escapeHTML(parrafo.trim())}</p>`).join("")}
const whatsapp="https://wa.me/?text="+encodeURIComponent(titulo+" - "+urlActual);const facebook="https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(urlActual);
contenedor.innerHTML=`<div class="contenido"><span class="categoria">${escapeHTML(data.categoria||"GENERAL")}</span><h1>${escapeHTML(titulo)}</h1>${fechaTexto?`<div class="fecha">📅 Publicado el ${fechaTexto}</div>`:""}</div>${imagen?`<img class="imagen-principal" src="${escapeHTML(imagen)}" alt="${escapeHTML(titulo)}">`:""}<div class="contenido"><div class="texto-noticia">${contenidoHTML}</div><div class="compartir"><strong>Compartir esta noticia</strong><a class="whatsapp" href="${whatsapp}" target="_blank" rel="noopener noreferrer">🟢 Compartir por WhatsApp</a><a class="facebook" href="${facebook}" target="_blank" rel="noopener noreferrer">🔵 Compartir en Facebook</a></div><a class="volver" href="./index.html">← Volver a las noticias</a></div>`}
function escapeHTML(texto){return String(texto||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
cargarNoticia();
