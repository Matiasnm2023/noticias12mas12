<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f1f3f5;color:#222}header{background:#111;color:#fff;text-align:center;padding:20px 15px}.logo img{width:110px;height:110px;object-fit:cover;border-radius:50%}.logo-text{font-size:36px;font-weight:900;margin-top:5px}.subtitulo{color:#ddd;font-size:17px}nav{background:#e30613;display:flex;justify-content:center;flex-wrap:wrap}nav a{color:#fff;text-decoration:none;font-weight:bold;padding:14px 18px}nav a:hover{background:#b9000c}.contenedor{max-width:900px;margin:30px auto;padding:0 15px}.noticia-completa{background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.12)}.contenido{padding:30px}.categoria{display:inline-block;background:#e30613;color:#fff;padding:7px 12px;border-radius:4px;font-size:14px;font-weight:bold;margin-bottom:15px}h1{font-size:42px;line-height:1.15;margin:0 0 15px}.fecha{color:#777;font-size:14px;margin-bottom:20px}.imagen-principal{width:100%;max-height:650px;object-fit:contain;background:#eee;display:block}.galeria{padding:0 30px 10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.galeria img{width:100%;max-height:500px;object-fit:contain;background:#eee;border-radius:6px;display:block}.texto-noticia p{font-size:19px;line-height:1.7;margin-bottom:20px;text-align:justify}.texto-noticia img{max-width:100%;height:auto;display:block;margin:20px auto;border-radius:7px}.texto-noticia video{max-width:100%;display:block;margin:20px auto;border-radius:7px;background:#111}.texto-noticia a{color:#d00000;font-weight:bold}.multimedia-enlace{display:block;background:#f1f1f1;padding:14px 16px;border-radius:7px;text-decoration:none;margin:15px 0;text-align:center}.volver{display:inline-block;margin-top:25px;background:#111;color:#fff;text-decoration:none;padding:12px 20px;border-radius:5px;font-weight:bold}.compartir{margin-top:30px;padding-top:20px;border-top:1px solid #ddd}.compartir strong{display:block;margin-bottom:12px}.compartir a{display:block;width:100%;padding:14px 18px;margin:10px 0;border-radius:7px;color:#fff;text-decoration:none;font-weight:bold;text-align:center;font-size:17px}.whatsapp{background:#25D366}.facebook{background:#1877F2}.error{background:#fff;padding:40px;text-align:center;border-radius:8px}footer{margin-top:40px;background:#111;color:#fff;text-align:center;padding:25px 15px}@media(max-width:700px){h1{font-size:30px}.contenido{padding:20px}.galeria{padding:0 20px 5px;grid-template-columns:1fr}.texto-noticia p{font-size:17px}}

<script>
const SUPABASE_URL="https://piyabciajfhlarvecdvu.supabase.co",SUPABASE_KEY="sb_publishable_t2UOYQYMPxYW1g5R4HoVaw_erREYkWK",supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),id=new URLSearchParams(location.search).get('id');
function escapeHTML(t){return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function sanitizeContent(html){const box=document.createElement('div');box.innerHTML=html;const allowed=['P','BR','STRONG','B','EM','I','IMG','VIDEO','SOURCE','A','DIV','SPAN'];box.querySelectorAll('*').forEach(el=>{if(!allowed.includes(el.tagName)){el.replaceWith(...el.childNodes);return}for(const a of [...el.attributes]){const n=a.name.toLowerCase();if(['src','alt','href','target','rel','controls','preload','data-social'].includes(n)){if((n==='src'||n==='href')&&!/^(https?:|data:)/i.test(a.value))el.removeAttribute(n)}else el.removeAttribute(n)}});box.querySelectorAll('a[data-social]').forEach(a=>{a.className='multimedia-enlace';a.textContent='🔗 Ver video en '+(a.getAttribute('data-social')||'la red social')});return box.innerHTML}
function textoViejo(t){return escapeHTML(t).split(/\n\s*\n/).map(x=>'<p>'+x.replace(/\n/g,'<br>')+'</p>').join('')}
function urlFacebook(url){return 'https://www.facebook.com/share_channel/?link='+encodeURIComponent(url)+'&app_id=966242223397117&source_surface=external_reshare&display&hashtag'}
async function cargarNoticia(){const c=document.getElementById('contenidoNoticia');if(!id){c.innerHTML='<div class="error"><h2>Noticia no encontrada</h2><p>No se indicó qué noticia querés ver.</p><a class="volver" href="./index.html">← Volver a las noticias</a></div>';return}const{data,error}=await supabaseClient.from('noticias').select('*').eq('id',id).single();if(error||!data){c.innerHTML='<div class="error"><h2>Noticia no encontrada</h2><p>La noticia que buscás no existe o fue eliminada.</p><a class="volver" href="./index.html">← Volver a las noticias</a></div>';return}const titulo=data.titulo||'12 + 12 Noticias de Tigre';let imagen=data.imagen||'';try{if(imagen)imagen=new URL(imagen,location.href).href}catch(e){}const{data:imagenes}=await supabaseClient.from('noticia_imagenes').select('url,orden,es_principal').eq('noticia_id',id).order('orden',{ascending:true});let galeria=Array.isArray(imagenes)?imagenes.filter(x=>x&&x.url):[];if(galeria.length===0&&imagen)galeria=[{url:imagen,orden:0,es_principal:true}];const principal=galeria.find(x=>x.es_principal)?.url||imagen;const extras=galeria.filter(x=>x.url!==principal);const urlCompartir=new URL('./noticias/'+id+'.html',location.origin).href;const whatsapp='https://wa.me/?text='+encodeURIComponent(titulo+'\n'+urlCompartir);document.title=titulo+' | 12 + 12 Noticias de Tigre';let fechaTexto=data.fecha?new Date(data.fecha).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'}):'';let contenidoHTML=String(data.contenido||'');contenidoHTML=/<\w[\s\S]*>/i.test(contenidoHTML)?sanitizeContent(contenidoHTML):textoViejo(contenidoHTML);let galeriaHTML=extras.length?'<div class="galeria">'+extras.map(x=>'<img src="'+escapeHTML(x.url)+'" alt="'+escapeHTML(titulo)+'">').join('')+'</div>':'';c.innerHTML='<div class="contenido"><span class="categoria">'+escapeHTML(data.categoria||'GENERAL')+'</span><h1>'+escapeHTML(titulo)+'</h1>'+(fechaTexto?'<div class="fecha">📅 Publicado el '+fechaTexto+'</div>':'')+'</div>'+(principal?'<img class="imagen-principal" src="'+escapeHTML(principal)+'" alt="'+escapeHTML(titulo)+'">':'')+galeriaHTML+'<div class="contenido"><div class="texto-noticia">'+contenidoHTML+'</div><div class="compartir"><strong>Compartir esta noticia</strong><a class="whatsapp" href="'+whatsapp+'" target="_blank" rel="noopener noreferrer">🟢 COMPARTIR POR WHATSAPP</a><a class="facebook" href="'+urlFacebook(urlCompartir)+'">🔵 COMPARTIR EN FACEBOOK</a></div><a class="volver" href="./index.html">← Volver a las noticias</a></div>';}
cargarNoticia();
</script>
