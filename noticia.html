<script>

const SUPABASE_URL =
"https://piyabciajfhlarvecdvu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_t2UOYQYMPxYW1g5R4HoVaw_erREYkWK";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


async function cargarNoticia() {

    const parametros =
        new URLSearchParams(window.location.search);

    const id =
        parametros.get("id");

    const contenedor =
        document.getElementById("noticia");

    if (!id) {

        contenedor.innerHTML = `
            <div class="error">
                No se encontró la noticia.
                <br><br>
                <a class="volver" href="index.html">
                    ← Volver a noticias
                </a>
            </div>
        `;

        return;
    }


    const { data, error } =
        await supabaseClient
        .from("noticias")
        .select("*")
        .eq("id", id)
        .single();


    if (error || !data) {

        contenedor.innerHTML = `
            <div class="error">
                No se pudo encontrar la noticia.
                <br><br>
                <a class="volver" href="index.html">
                    ← Volver a noticias
                </a>
            </div>
        `;

        return;
    }


    const contenido =
        data.contenido
        ? data.contenido
            .split(/\n\s*\n/)
            .map(parrafo =>
                `<p>${parrafo.trim()}</p>`
            )
            .join("")
        : "";


    contenedor.innerHTML = `

        <div class="categoria">
            ${data.categoria || "GENERAL"}
        </div>

        <h1>
            ${data.titulo}
        </h1>

        <div class="fecha">
            12 + 12 Noticias de Tigre
        </div>

        ${
            data.imagen
            ?
            `<img
                class="imagen-principal"
                src="${data.imagen}"
                alt="${data.titulo}">
            `
            :
            ""
        }

        <div class="contenido">
            ${contenido}
        </div>

        <a class="volver" href="index.html">
            ← Volver a noticias
        </a>

    `;

    document.title =
        data.titulo +
        " - 12 + 12 Noticias de Tigre";

}


cargarNoticia();

</script>
