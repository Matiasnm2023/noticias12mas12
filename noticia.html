<script>
const SUPABASE_URL="https://piyabciajfhlarvecdvu.supabase.co";const SUPABASE_KEY="sb_publishable_t2UOYQYMPxYW1g5R4HoVaw_erREYkWK";const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const id=new URLSearchParams(window.location.search).get("id");

const titulo=data.titulo||"12 + 12 Noticias de Tigre";let imagen=data.imagen||"https://noticias12mas12.com.ar/logo.jpg";try{imagen=new URL(imagen,window.location.href).href}catch(e){}

const urlActual=window.location.href;const whatsapp="https://wa.me/?text="+encodeURIComponent(titulo+"\n"+urlActual);const facebook="https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(urlActual);

}
