<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Administración - 12 + 12 Noticias de Tigre</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f1f3f5;color:#222}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#111}.login-box{width:100%;max-width:420px;background:#fff;padding:30px;border-radius:12px;box-shadow:0 5px 30px #00000059}.login-box h1{margin-top:0;text-align:center}.login-box p{text-align:center;color:#666}.login-box input{width:100%;padding:13px;margin:8px 0;border:1px solid #ccc;border-radius:6px;font-size:16px}.login-box button{width:100%;padding:13px;margin-top:10px;border:0;border-radius:6px;background:#e30613;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}#mensajeLogin{margin-top:15px;text-align:center;font-weight:bold;min-height:22px}#sitio{display:none}
</style>
</head>
<body>
<div class="login" id="login"><div class="login-box"><h1>🔐 Administración</h1><p>12 + 12 Noticias de Tigre</p><input type="email" id="email" placeholder="Email" autocomplete="email"><input type="password" id="password" placeholder="Contraseña" autocomplete="current-password"><button type="button" id="btnIngresar">Ingresar</button><div id="mensajeLogin"></div></div></div>
<div id="sitio"></div>
<script>
const SUPABASE_URL="https://piyabciajfhlarvecdvu.supabase.co";
const SUPABASE_KEY="sb_publishable_t2UOYQYMPxYW1g5R4HoVaw_erREYkWK";
const mensaje=document.getElementById("mensajeLogin");
const btn=document.getElementById("btnIngresar");

async function iniciarSesion(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 if(!email||!password){mensaje.innerText="Ingresá email y contraseña.";return}
 btn.disabled=true;btn.innerText="Ingresando...";mensaje.innerText="Conectando...";
 try{
  const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{
   method:"POST",
   headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},
   body:JSON.stringify({email,password})
  });
  const raw=await r.text();
  let data={};try{data=JSON.parse(raw)}catch(_){}
  if(!r.ok){
   mensaje.innerText="❌ "+(data.error_description||data.msg||data.message||("Error HTTP "+r.status));
   return;
  }
  if(!data.access_token){
   mensaje.innerText="❌ Supabase no devolvió una sesión.";
   return;
  }
  localStorage.setItem("sb-session",JSON.stringify(data));
  mensaje.innerText="✅ Acceso correcto. Cargando...";
  document.getElementById("login").style.display="none";
  document.getElementById("sitio").style.display="block";
 }catch(e){
  mensaje.innerText="❌ Error de conexión: "+(e.message||"No se pudo conectar.");
 }finally{
  btn.disabled=false;btn.innerText="Ingresar";
 }
}
btn.addEventListener("click",iniciarSesion);
document.getElementById("password").addEventListener("keydown",e=>{if(e.key==="Enter")iniciarSesion()});
document.getElementById("email").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("password").focus()});
mensaje.innerText="Sistema de acceso listo.";
</script>
</body>
</html>
