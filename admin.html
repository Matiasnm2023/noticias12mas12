<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración - 12 + 12 Noticias de Tigre</title>
<style>body{margin:0;font-family:Arial;background:#111}.login{min-height:100vh;display:flex;align-items:center;justify-content:center}.box{background:#fff;width:min(420px,90%);padding:30px;border-radius:12px}.box h1{text-align:center}.box input,.box button{width:100%;padding:14px;margin:8px 0;box-sizing:border-box;font-size:16px}.box button{background:#e30613;color:#fff;border:0;border-radius:6px;font-weight:bold}.box button:disabled{opacity:.6}#msg{text-align:center;font-weight:bold;min-height:24px}</style></head>
<body><div class="login"><div class="box"><h1>🔐 Administración</h1><p style="text-align:center">12 + 12 Noticias de Tigre</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Contraseña"><button id="btn" type="button">INGRESAR</button><div id="msg">Página cargada correctamente.</div></div></div>
<script>
(function(){
"use strict";
var btn=document.getElementById("btn"),msg=document.getElementById("msg"),email=document.getElementById("email"),password=document.getElementById("password");
function setMsg(t){msg.textContent=t}
btn.onclick=function(){
 setMsg("BOTÓN FUNCIONANDO — conectando...");
 btn.disabled=true;
 var xhr=new XMLHttpRequest();
 xhr.open("POST","https://piyabciajfhlarvecdvu.supabase.co/auth/v1/token?grant_type=password",true);
 xhr.setRequestHeader("apikey","sb_publishable_t2UOYQYMPxYW1g5R4HoVaw_erREYkWK");
 xhr.setRequestHeader("Content-Type","application/json");
 xhr.onreadystatechange=function(){
  if(xhr.readyState!==4)return;
  btn.disabled=false;
  if(xhr.status>=200&&xhr.status<300){
   setMsg("✅ ACCESO CORRECTO. La autenticación funciona.");
   try{localStorage.setItem("sb-session",xhr.responseText)}catch(e){}
  }else{
   var d={};try{d=JSON.parse(xhr.responseText)}catch(e){}
   setMsg("❌ "+(d.error_description||d.msg||d.message||("Error HTTP "+xhr.status)));
  }
 };
 xhr.onerror=function(){btn.disabled=false;setMsg("❌ El navegador bloqueó la conexión con Supabase.")};
 try{xhr.send(JSON.stringify({email:email.value.trim(),password:password.value}))}catch(e){btn.disabled=false;setMsg("❌ "+e.message)}
};
password.onkeydown=function(e){if(e.key==="Enter")btn.click()};
})();
</script></body></html>
