name: Generar previews de Facebook

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: write

jobs:
  generar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Generar paginas de preview
        env:
          SUPABASE_URL: https://piyabciajfhlarvecdvu.supabase.co
          SUPABASE_KEY: sb_publishable_t2UOYQYMPxYW1g5R4HoVaw_erREYkWK
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const base = process.env.SUPABASE_URL;
          const previewDir = path.join(process.cwd(), 'previews');
          fs.mkdirSync(previewDir, { recursive: true });
          const key = process.env.SUPABASE_KEY;
          const esc = (v) => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
          const strip = (v) => String(v ?? '').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,220);
          async function main(){
            const url = `${base}/rest/v1/noticias?select=id,titulo,contenido,imagen&order=id.asc`;
            const r = await fetch(url,{headers:{apikey:key,Authorization:`Bearer ${key}`,Accept:'application/json'}});
            if(!r.ok) throw new Error(`Supabase HTTP ${r.status}`);
            const noticias = await r.json();
            for(const n of noticias){
              const id = encodeURIComponent(n.id);
              const titulo = n.titulo || '12 + 12 Noticias de Tigre';
              const descripcion = strip(n.contenido) || titulo;
              let imagen = 'https://noticias12mas12.com.ar/logo.jpg';
              let imageType = 'image/jpeg';
              if (n.imagen) {
                try {
                  const imgResponse = await fetch(n.imagen);
                  if (imgResponse.ok) {
                    const contentType = (imgResponse.headers.get('content-type') || '').split(';')[0].trim().toLowerCase();
                    const extensions = {'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif'};
                    const ext = extensions[contentType];
                    const declaredSize = Number(imgResponse.headers.get('content-length') || 0);
                    if (ext && (!declaredSize || declaredSize <= 5 * 1024 * 1024)) {
                      const buffer = Buffer.from(await imgResponse.arrayBuffer());
                      if (buffer.length > 0 && buffer.length <= 5 * 1024 * 1024) {
                        const localName = `noticia-${n.id}.${ext}`;
                        fs.writeFileSync(path.join(previewDir, localName), buffer);
                        imagen = `https://noticias12mas12.com.ar/previews/${localName}`;
                        imageType = contentType;
                      }
                    }
                  }
                } catch (e) {
                  console.warn(`No se pudo copiar la imagen de la noticia ${n.id}: ${e.message}`);
                }
              }
              const article = `https://noticias12mas12.com.ar/noticia.html?id=${id}`;
              const preview = `https://noticias12mas12.com.ar/compartir-${id}.html`;
              const html = `<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta property="og:type" content="article"><meta property="og:site_name" content="12 + 12 Noticias de Tigre"><meta property="og:title" content="${esc(titulo)}"><meta property="og:description" content="${esc(descripcion)}"><meta property="og:url" content="${preview}"><meta property="og:image" content="${esc(imagen)}"><meta property="og:image:secure_url" content="${esc(imagen)}"><meta property="og:image:type" content="${imageType}"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="${esc(titulo)}"><meta name="twitter:description" content="${esc(descripcion)}"><meta name="twitter:image" content="${esc(imagen)}"><link rel="canonical" href="${article}"><title>${esc(titulo)} | 12 + 12 Noticias de Tigre</title></head><body><p>Abriendo la noticia…</p><p><a href="${article}">Si no se abre automáticamente, hacé clic acá.</a></p><script>setTimeout(function(){location.replace(${JSON.stringify(article)});},300);</script></body></html>`;
              fs.writeFileSync(path.join(`compartir-${n.id}.html`),html);
            }
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compartir-*.html previews/
          git diff --cached --quiet && exit 0
          git commit -m "Fix previews de Facebook sin redireccion meta"
          git push
